#
# Zero-SPA fwknopd Configuration
# /etc/fwknop/fwknopd.conf
#

# Network interface to listen on
PCAP_INTF                   eth0

# Enable UDP server mode (required when pcap not available)
ENABLE_UDP_SERVER           Y
UDPSERV_PORT                62201

# Verbose logging
VERBOSE                     Y

# Maximum age of SPA packet (seconds)
MAX_SPA_PACKET_AGE          120

# Enable replay attack detection
ENABLE_DIGEST_PERSISTENCE   Y

# Digest cache file
DIGEST_FILE                 /var/log/fwknop/digest.cache
